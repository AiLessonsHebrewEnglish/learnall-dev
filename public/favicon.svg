<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="10" fill="#fff"/>
  <g transform="translate(32 32)">
    <!-- book: left page (lighter) + right page (darker) -->
    <path d="M0 -9 L-10 -16 L-10 12 L0 18 Z" fill="#74C0FC"/>
    <path d="M0 -9 L10 -16 L10 12 L0 18 Z" fill="#228BE6"/>
    <rect x="-1" y="-9" width="2" height="27" fill="#0B1C3E"/>

    <!-- growth arrow -->
    <path d="M0 10 L0 -7 M0 -7 L-5 -2 L0 -4.5 L5 -2 Z" fill="#228BE6"/>

    <!-- brain (left) -->
    <g fill="none" stroke="#74C0FC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" transform="translate(-4 -1)">
      <path d="M0 5 Q-4 1 -2 -4 Q0 -6 4 -4 Q6 1 4 5 Q2 7 0 6 Q-2 7 -4 5 Z"/>
      <path d="M-1 1 L0 -3 M1 1 L0 -3 M-3 -1 L-5 -4 M3 -1 L5 -4"/>
    </g>

    <!-- circuit nodes (right) -->
    <g fill="none" stroke="#4DABF7" stroke-width="1.4" transform="translate(5 -1)">
      <circle cx="0" cy="0" r="1.6" fill="#228BE6"/>
      <circle cx="5" cy="-1" r="1.3" fill="#228BE6"/>
      <circle cx="-4" cy="1" r="1.3" fill="#228BE6"/>
      <circle cx="2" cy="4" r="1.3" fill="#228BE6"/>
      <line x1="0" y1="0" x2="5" y2="-1"/>
      <line x1="0" y1="0" x2="-4" y2="1"/>
      <line x1="0" y1="0" x2="2" y2="4"/>
    </g>
  </g>
</svg>
